<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Together preview</title>
    <style>
      @font-face {
        font-family: 'Atkinson Hyperlegible Next';
        font-weight: 600 700;
        src: url('/fonts/atkinson-hyperlegible-next-latin-700-normal.woff2') format('woff2');
      }
      html, body { margin: 0; height: 100%; background: #f2c7a0; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #status { position: fixed; left: 12px; top: 10px; font: 600 13px system-ui; color: #fff6e8; text-shadow: 0 1px 2px #0008; }
      #pip { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); max-width: 70vw; font: 600 17px 'Atkinson Hyperlegible Next', system-ui; color: #3a2e29; background: #fbf4e6ee; border-radius: 14px; padding: 8px 14px; display: none; }
    </style>
  </head>
  <body>
    <div id="status"></div>
    <div id="pip"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
