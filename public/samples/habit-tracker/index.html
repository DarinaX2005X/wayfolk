<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Habit tracker</title>
  <meta name="description" content="Add a habit, tick it off each day, and keep your streaks in this browser.">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="page-header">
    <h1>Habit tracker</h1>
    <p class="lede">Add a habit, tick it on the days you do it, and watch the streak grow.</p>
  </header>

  <main>
    <form id="add-habit" class="add-habit" autocomplete="off">
      <label for="habit-name">Habit name</label>
      <div class="field-row">
        <input id="habit-name" name="habit-name" type="text" maxlength="60" autocomplete="off" required>
        <button type="submit" class="btn-add">
          <svg class="icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
            <path d="M8 3v10M3 8h10" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"></path>
          </svg>
          Add habit
        </button>
      </div>
    </form>

    <section class="habits" aria-labelledby="habits-heading">
      <h2 id="habits-heading">Your habits</h2>
      <ul id="habit-list" class="habit-list"></ul>
    </section>

    <section class="streaks" aria-labelledby="streaks-heading">
      <h2 id="streaks-heading">Streaks</h2>
      <div id="streak-summary" class="streak-summary" aria-live="polite"></div>
    </section>
  </main>

  <footer class="page-footer">
    <p>Everything you add stays in this browser's local storage.</p>
  </footer>
</body>
</html>
